name: Reset the public demo

# Every night, put the demo's fictional data back: visitors' status changes and
# analysed jobs are replaced by demo/seed.sql. Who has used their one live AI
# run (the DemoRun table) is kept. Then check the live demo holds exactly the
# seed, with the read-only smoke suite.
#
# Needs two repository secrets: CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN
# (a token with D1 edit permission). Without them the job skips itself.

on:
  schedule:
    - cron: "0 13 * * *" # 13:00 UTC, about 2am in New Zealand
  workflow_dispatch:

permissions:
  contents: read

env:
  DEMO_URL: https://jobpilot-demo.fionasundev.workers.dev

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Skip without Cloudflare secrets
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::CLOUDFLARE_API_TOKEN is not set as a repository secret; the demo was not reset."
      - uses: actions/checkout@v7
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v7
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
        if: env.CLOUDFLARE_API_TOKEN != ''
      - name: Reload the demo data
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run demo:reset -- --data
      - name: Install Chromium
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx playwright install --with-deps chromium
      - name: The live demo holds exactly the seed
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          BASE_URL: ${{ env.DEMO_URL }}
          EXPECT_SEED: "1"
        run: npm run e2e:smoke
