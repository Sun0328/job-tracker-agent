name: CodeQL

# Static security analysis of the TypeScript (injection, unsafe redirects, path
# traversal, ...). Findings appear under the repository's Security tab and on pull
# requests. Weekly as well, because new queries find old code.

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 18 * * 0" # Sunday 18:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
